<!DOCTYPE html>
<html lang="en">
<head>
  <title>Brainstorm companion</title>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <style>
    /*
     * Frame for fragment screens.
     * The server swaps two comment markers: the branding one inside the top bar, and the content one inside
     * #frame-content. Colours follow the system light or dark setting through a prefers-color-scheme media query. Everything from
     * "text styles" down is what a fragment may use; visual-companion.md shows the markup for each.
     */

    :root {
      color-scheme: light dark;

      --page-bg: #f4f4f1;
      --bg-secondary: #fff;
      --bg-tertiary: #e8e8e3;
      --border: #d2d2ca;
      --text-primary: #1e1f22;
      --text-secondary: #707076;
      --text-tertiary: #a2a2a8;
      --accent: #1c6ae0;
      --accent-hover: #3a80ee;
      --success: #2a9d4c;
      --warning: #e68a00;
      --error: #d63c3c;
      --selected-bg: #e4eefc;
      --selected-border: #1c6ae0;

      /* Short names the rules below use, so the public variables above can change without touching them. */
      --page: var(--page-bg);
      --surface: var(--bg-secondary);
      --sunken: var(--bg-tertiary);
      --line: var(--border);
      --ink: var(--text-primary);
      --ink-soft: var(--text-secondary);
      --ink-faint: var(--text-tertiary);
      --brand: var(--accent);
      --pick-fill: var(--selected-bg);
      --pick-line: var(--selected-border);
    }

    /* Dark palette: only the public variables change; the short names above follow them. */
    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #1a1b1d;
        --bg-secondary: #27282b;
        --bg-tertiary: #36373b;
        --border: #45464b;
        --text-primary: #f0f0ee;
        --text-secondary: #8c8d93;
        --text-tertiary: #66676d;
        --accent: #4f9cff;
        --accent-hover: #78b2ff;
        --selected-bg: rgb(79 156 255 / 15%);
        --selected-border: #4f9cff;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; }

    body {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      background: var(--page);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* ---- top bar: brand text and connection pill ---- */
    .top-bar {
      flex: none;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      column-gap: 1rem;
      min-height: 42px;
      padding-block: .5rem;
      padding-inline: 1.5rem;
      background: var(--surface);
      border-bottom: solid 1px var(--line);
    }
    .brand { min-width: 0; overflow: hidden; font-size: 12px; line-height: 1; }
    .brand-text { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    /* helper.js sets data-state on the pill; each state only changes --status-color. */
    .status {
      --status-color: var(--success);
      grid-column: 2;
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      font-size: 11px;
      line-height: 1;
      color: var(--status-color);
    }
    .status[data-state="connecting"] { --status-color: var(--ink-faint); }
    .status[data-state="reconnecting"] { --status-color: var(--warning); }
    .status[data-state="disconnected"] { --status-color: var(--error); }
    .status::before {
      content: "";
      inline-size: 6px;
      block-size: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .scroll-area { flex: 1; overflow: auto; }
    #frame-content { min-height: 100%; padding: 2rem; }

    /* ---- text styles ---- */
    h2 { margin-block-end: .5rem; font-weight: 650; font-size: 1.5rem; }
    h3 { margin-block-end: .25rem; font-weight: 650; font-size: 1.1rem; }
    .section { margin-block-end: 2rem; }
    .subtitle { margin-block-end: 1.5rem; }
    .label {
      margin-block-end: .5rem;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    /* ---- options: lettered choices ---- */
    .options { display: grid; gap: .75rem; }
    .option {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: start;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border: solid 2px var(--line);
      border-radius: 10px;
      background: var(--surface);
      cursor: pointer;
      transition: border-color .15s, background-color .15s;
    }
    :is(.option, .card).selected { border-color: var(--pick-line); }
    .option .letter {
      flex: none;
      display: grid;
      place-items: center;
      inline-size: 1.75rem;
      block-size: 1.75rem;
      border-radius: 6px;
      background: var(--sunken);
      color: var(--ink-soft);
      font-weight: 650;
      font-size: .85rem;
    }
    .option.selected .letter { color: #fff; background: var(--brand); }
    .option .content { flex: 1; min-inline-size: 0; }
    .option .content h3 { margin-block-end: 2px; font-size: .95rem; }
    .option.selected { background-color: var(--pick-fill); }

    /* ---- cards: designs to compare ---- */
    /* Boxes that wrap into as many columns as fit, and share the row when there are few. */
    .cards, .split, .pros-cons { display: flex; flex-wrap: wrap; gap: 1rem; }
    .cards > * { flex: 1 1 280px; }
    .split > * { flex: 1 1 320px; }
    .pros-cons > * { flex: 1 1 220px; }
    .split { gap: 1.5rem; }
    .split > .mockup { margin-block-end: 0; }
    .card {
      overflow: hidden;
      border: solid 1px var(--line);
      border-radius: 10px;
      background: var(--surface);
      cursor: pointer;
      transition: border-color .15s, translate .15s, box-shadow .15s;
    }
    .card:hover { translate: 0 -2px; box-shadow: 0 6px 16px rgb(0 0 0 / 12%); }
    .card-image {
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 10;
      background: var(--sunken);
    }
    .card-body { padding: 16px; }
    .card.selected { border-width: 2px; }

    :is(.option, .card):hover { border-color: var(--brand); }

    /* ---- mockup frame and split view ---- */
    .mockup {
      overflow: hidden;
      margin-block-end: 1.5rem;
      border: solid 1px var(--line);
      border-radius: 10px;
      background: var(--surface);
    }
    .mockup-header {
      padding: .5rem 1rem;
      border-block-end: solid 1px var(--line);
      background: var(--sunken);
      font-size: .75rem;
    }
    .mockup-body { padding: 24px; }

    /* ---- pros and cons: --tone colours the heading ---- */
    .pros-cons { margin-block: 1rem; }
    .pros, .cons { padding: 1rem; border-radius: 8px; background: var(--surface); }
    .pros { --tone: var(--success); }
    .cons { --tone: var(--error); }
    .pros h4, .cons h4 { margin-block-end: .5rem; color: var(--tone); font-size: .85rem; }
    :is(.pros, .cons) ul { margin-inline-start: 1.25rem; font-size: .85rem; }
    .pros li + li, .cons li + li { margin-block-start: .25rem; }

    /* ---- wireframe parts ---- */
    .placeholder {
      padding: 2rem;
      border-radius: 8px;
      border: dashed 2px var(--line);
      background: var(--sunken);
      color: var(--ink-faint);
      text-align: center;
    }
    .mock-nav {
      display: flex;
      gap: 1.5rem;
      padding: .75rem 1rem;
      background: var(--brand);
      color: #fff;
      font-size: .9rem;
    }
    .mock-sidebar { min-inline-size: 180px; padding: 1rem; background: var(--sunken); }
    .mock-content { flex: 1; padding: 1.5rem; }
    .mock-button {
      padding: .5rem 1rem;
      border: 0;
      border-radius: 6px;
      background: var(--brand);
      color: #fff;
      font-size: .85rem;
    }
    .mock-input {
      inline-size: 100%;
      padding: .5rem;
      border-radius: 6px;
      background: var(--page);
      border: solid 1px var(--line);
    }

    /* ---- muted text, shared by every element that explains rather than asks ---- */
    .brand, .subtitle, .label, .mockup-header,
    .option .content p, .card-body p, .pros ul, .cons ul { color: var(--ink-soft); }
    .option .content p, .card-body p { font-size: .85rem; }

    /* end of frame styles */
  </style>
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="top-bar">
    <!-- BRANDING -->
    <span class="status">Connecting…</span>
  </header>

  <main class="scroll-area">
    <section id="frame-content" aria-label=Screen>
      <!-- CONTENT -->
    </section>
  </main>
</body>
</html>
