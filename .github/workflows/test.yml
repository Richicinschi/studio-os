name: tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  # The weekly schedule is for the scan and links jobs alone; the tests run on pushes, pull requests and manual runs.
  # Linux, Windows and macOS on the public repository, whose ruleset requires the three job names; Linux only
  # on a private one, where Windows minutes count twice and macOS minutes ten times against the allowance.
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.repository.private && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      - run: npm run lint

  # The newer Node.js line, on Linux. The ruleset does not require it, but the release steps wait for the whole
  # run to pass (gh run watch --exit-status), so a failure here stops a release too: package.json promises 22.2 or later.
  test-node-24:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test
      - run: npm run lint

  # Rescans every gated item with the pinned SkillSpector and compares the findings with tools/export/scans.json.
  # Not on pull requests or pushes to main: only release branches, a manual run and the weekly schedule.
  # A red weekly run means re-triage (a new CVE or rule hit), not flaky CI; see docs/MAINTAINING.md.
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No token left in the checkout: this job installs and runs third-party Python.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # SkillSpector v2.13.6, pinned by commit as in tools/export/scanner.json.
      - run: pip install "skillspector @ git+https://github.com/NVIDIA/skillspector.git@e2674da339b0bddc6e565d059c0577c6d9cd25da"
      - run: pip freeze
      - run: node tools/export/scan.mjs --check
        env:
          PYTHONUTF8: '1'

  # Every source link in docs/facts.md still answers. Weekly and by hand only: it needs the network and a
  # vendor's page can be down for an hour, so it never runs on a push and no ruleset requires it.
  links:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/docs/check-links.mjs
