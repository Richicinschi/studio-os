# Copy to the repo root as .pre-commit-config.yaml and run with prek.
# Before the first commit: detect-secrets scan > .secrets.baseline
# Replace every <latest> with a real release from the project's releases/tags page.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: <latest>
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: <latest>
    hooks:
      - id: shellcheck
        args: [--severity=error]

  - repo: https://github.com/Yelp/detect-secrets
    rev: <latest>
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: https://github.com/rhysd/actionlint
    rev: <latest>
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: <latest>
    hooks:
      - id: zizmor
        args: [--min-severity=medium, --min-confidence=medium, --persona=regular]
